[package]
name = "rcode"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
libloading = "0.9"
png = { version = "0.18", optional = true }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tree-sitter = "0.27.2"
tree-sitter-highlight = "0.27.2"
tree-sitter-language = "0.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[features]
# Development only: render scenes to PNG without a display (`cargo run --features screenshot -- --screenshot <scene> <out.png>`).
screenshot = ["dep:png"]
